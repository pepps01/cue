
name: Test SSH Connection Only

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Debug SSH Key Format
        run: |
          echo "First line of key:"
          echo "${{ secrets.CUE_SSH_KEY }}" | head -1
          echo "Key length:"
          echo "${{ secrets.CUE_SSH_KEY }}" | wc -c
      
      - name: Test SSH Connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.CUE_SSH_KEY }}
          script: |
            echo "Connected successfully!"
            whoami
            pwd